<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobby日语学习乐园 · Mobby Japanese Learning Land</title>
<style>
  :root {
    --bg: #FFF5F8;
    --ink: #3D2B4F;
    --muted: #9B7BB5;
    --en: #7A6B8A;
    --pink: #FF8FAB;
    --lavender: #C9B8FF;
    --mint: #98E8D2;
    --peach: #FFB347;
    --blue: #A5C8FF;
    --yellow: #FFE066;
    --card: #FFFFFF;
    --line: #F0E0F0;
    --radius: 22px;
    --shadow: 0 8px 24px rgba(255, 143, 171, .18);
    --shadow-sm: 0 4px 12px rgba(61, 43, 79, .08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic UI", "YuGothic", "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
  }
  /* floating pastel blobs */
  .blob { position: fixed; border-radius: 50%; opacity: .5; pointer-events: none; z-index: 0; }
  .b1 { width: 340px; height: 340px; background: #FFC2D4; top: -140px; left: -120px; }
  .b2 { width: 300px; height: 300px; background: #DCD0FF; bottom: -120px; right: -100px; }
  .b3 { width: 180px; height: 180px; background: #BDF0E0; top: 12%; right: -60px; }
  .b4 { width: 150px; height: 150px; background: #FFEFB0; bottom: 18%; left: -50px; }
  .deco { position: fixed; pointer-events: none; z-index: 0; opacity: .8; }

  .app { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: 20px 18px 70px; }

  /* mascots: inline spans need explicit display for width/height to apply */
  .mascot { display: inline-block; flex: none; line-height: 0; }
  .mascot svg { display: block; width: 100%; height: 100%; }

  /* speaker buttons */
  .spk {
    border: none; cursor: pointer; flex: none;
    width: 30px; height: 30px; border-radius: 50%;
    background: #EBFBF4; color: #2FA57D;
    display: inline-grid; place-items: center;
    transition: transform .15s ease, background .15s ease;
    padding: 0; vertical-align: middle;
  }
  .spk:hover { transform: scale(1.12); background: var(--mint); color: #fff; }
  .spk.playing { background: var(--mint); color: #fff; animation: pulse 1s ease infinite; }
  .spk svg { width: 15px; height: 15px; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
  .spk-lg { width: 40px; height: 40px; }
  .spk-lg svg { width: 20px; height: 20px; }
  .tts-hint { text-align: center; font-size: 12px; color: var(--muted); margin: -8px 0 16px; }

  /* header */
  header { display: flex; align-items: center; gap: 12px; padding: 8px 0 22px; }
  .home-btn {
    display: none; border: none; cursor: pointer;
    background: var(--card); color: var(--ink);
    font: inherit; font-weight: 700; font-size: 14px;
    padding: 9px 16px; border-radius: 999px; box-shadow: var(--shadow-sm);
    transition: transform .15s ease;
  }
  .home-btn:hover { transform: translateY(-2px); }
  .home-btn:focus-visible, .opt:focus-visible, .btn:focus-visible, .card-btn:focus-visible, .lesson-head:focus-visible {
    outline: 3px solid var(--pink); outline-offset: 2px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .mascot { width: 46px; height: 46px; flex: none; }
  .brand h1 { font-size: 22px; letter-spacing: .5px; }
  .brand small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; font-style: italic; }

  /* course home */
  .hero { text-align: center; margin: 6px 0 26px; }
  .hero h2 { font-size: 26px; margin-bottom: 6px; }
  .hero p { color: var(--muted); font-size: 14px; }
  .grid { display: grid; gap: 16px; }
  @media (min-width: 640px) { .grid.courses { grid-template-columns: repeat(3, 1fr); } }

  .card-btn {
    border: none; cursor: pointer; text-align: left; font: inherit; color: var(--ink);
    background: var(--card); border-radius: var(--radius);
    padding: 22px 20px; box-shadow: var(--shadow-sm);
    transition: transform .18s ease, box-shadow .18s ease;
    position: relative; overflow: hidden;
  }
  .card-btn:hover { transform: translateY(-4px); box-shadow: var(--shadow); }
  .card-btn .top-bar { position: absolute; top: 0; left: 0; right: 0; height: 8px; }
  .card-btn .mascot { width: 62px; height: 62px; margin-bottom: 12px; }
  .card-btn h3 { font-size: 18px; margin-bottom: 3px; }
  .card-btn .sub { display: block; font-size: 12px; font-style: italic; color: var(--muted); margin-bottom: 8px; }
  .card-btn .desc { display: block; font-size: 12.5px; color: var(--en); line-height: 1.6; }
  .badge {
    display: inline-block; margin-top: 12px; font-size: 12px; font-weight: 700;
    color: #fff; padding: 5px 14px; border-radius: 999px;
  }

  /* chapters */
  .chapter-card { display: flex; align-items: center; gap: 16px; }
  .chapter-card .mascot { width: 54px; height: 54px; margin: 0; flex: none; }
  .chapter-card .label {
    font-size: 12px; font-weight: 700; color: #fff; padding: 4px 12px;
    border-radius: 999px; display: inline-block; margin-bottom: 5px;
  }
  .chapter-card .meta { flex: 1; }
  .chapter-card h3 { font-size: 17px; }
  .chapter-card .sub { margin-bottom: 0; }
  .chapter-card .arrow { font-size: 20px; color: var(--muted); }
  .done-star { font-size: 13px; margin-left: 6px; }

  /* lessons */
  .lesson { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow-sm); overflow: hidden; }
  .lesson-head {
    width: 100%; border: none; cursor: pointer; font: inherit; text-align: left;
    display: flex; align-items: center; gap: 12px; padding: 15px 18px;
    background: transparent; color: var(--ink);
  }
  .day-chip {
    flex: none; font-size: 12px; font-weight: 700; color: #fff;
    padding: 5px 12px; border-radius: 999px; min-width: 62px; text-align: center;
  }
  .lesson-head .t { flex: 1; }
  .lesson-head .t b { font-size: 15px; }
  .lesson-head .t small { display: block; font-size: 11.5px; color: var(--muted); font-style: italic; }
  .lesson-head .chev { transition: transform .2s ease; color: var(--muted); }
  .lesson.open .chev { transform: rotate(90deg); }
  .lesson-body { display: none; padding: 2px 18px 16px; }
  .lesson.open .lesson-body { display: block; }

  .phrase { display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px dashed var(--line); align-items: flex-start; }
  .phrase:last-child { border-bottom: none; }
  .phrase .body { flex: 1; min-width: 0; }
  .phrase .jp-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .star-dot {
    flex: none; width: 26px; height: 26px; border-radius: 50%;
    display: grid; place-items: center; color: #fff; font-size: 11px; margin-top: 2px;
  }
  .phrase .jp { font-weight: 700; font-size: 15.5px; }
  .phrase .ro { font-size: 12px; font-style: italic; color: var(--muted); margin: 1px 0 2px; }
  .phrase .tr { font-size: 12.5px; color: #5A4A6B; }
  .phrase .tr .sep { color: #C8B8D8; margin: 0 6px; }
  .phrase .tr .e { color: var(--en); }
  .phrase.activity .jp { font-size: 14px; }

  .lesson-quiz-row { text-align: center; padding: 14px 0 6px; border-top: 1px dashed var(--line); margin-top: 8px; }
  .btn-sm { font-size: 13.5px; padding: 10px 24px; }
  .no-quiz { font-size: 12.5px; color: var(--muted); }

  .quiz-cta {
    margin-top: 22px; text-align: center;
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 26px 20px;
  }
  .quiz-cta .mascot { width: 70px; height: 70px; }
  .quiz-cta h3 { margin: 8px 0 4px; }
  .quiz-cta p { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
  .btn {
    border: none; cursor: pointer; font: inherit; font-weight: 700; font-size: 15px;
    color: #fff; background: var(--pink); padding: 12px 32px; border-radius: 999px;
    box-shadow: 0 6px 16px rgba(255,143,171,.4);
    transition: transform .15s ease;
  }
  .btn:hover { transform: translateY(-2px) scale(1.02); }
  .btn.ghost { background: var(--card); color: var(--ink); box-shadow: var(--shadow-sm); }

  /* quiz */
  .quiz-wrap { max-width: 620px; margin: 0 auto; }
  .q-progress { display: flex; justify-content: center; gap: 10px; margin: 6px 0 20px; }
  .q-dot { width: 13px; height: 13px; border-radius: 50%; background: #EFD9E6; transition: background .2s; }
  .q-dot.now { background: var(--pink); transform: scale(1.25); }
  .q-dot.ok { background: var(--mint); }
  .q-dot.bad { background: #FFB3C1; }
  .q-card {
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 28px 24px; text-align: center;
  }
  .q-type { font-size: 12px; font-weight: 700; color: #fff; background: var(--lavender);
    display: inline-block; padding: 4px 14px; border-radius: 999px; margin-bottom: 14px; }
  .q-text { font-size: 21px; font-weight: 700; line-height: 1.5; margin-bottom: 4px; }
  .q-hint { font-size: 13px; color: var(--muted); font-style: italic; min-height: 18px; margin-bottom: 18px; }
  .opts { display: grid; gap: 11px; }
  @media (min-width: 520px) { .opts { grid-template-columns: 1fr 1fr; } }
  .opt {
    border: 2.5px solid var(--line); background: #FFFBFD; cursor: pointer; font: inherit;
    color: var(--ink); font-size: 15px; font-weight: 600;
    padding: 13px 14px; border-radius: 16px; transition: all .15s ease;
  }
  .opt:hover:not(:disabled) { border-color: var(--pink); transform: translateY(-2px); }
  .opt:disabled { cursor: default; }
  .opt.correct { border-color: var(--mint); background: #EBFBF4; }
  .opt.wrong { border-color: #FF9FBA; background: #FFF0F4; animation: shake .35s ease; }
  .opt.dim { opacity: .45; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .q-feedback { min-height: 26px; margin-top: 16px; font-weight: 700; font-size: 15px; }
  .q-feedback.ok { color: #2FA57D; }
  .q-feedback.no { color: #E86A8A; }

  /* result */
  .result { text-align: center; background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 36px 24px; max-width: 560px; margin: 0 auto; }
  .result .mascot { width: 100px; height: 100px; }
  .result h2 { font-size: 26px; margin: 10px 0 4px; }
  .result .score { font-size: 46px; font-weight: 800; color: var(--pink); margin: 6px 0; }
  .result p { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
  .result .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .stars-row { font-size: 26px; letter-spacing: 6px; margin: 4px 0 10px; }

  .section-title { display: flex; align-items: center; gap: 12px; margin: 4px 0 18px; }
  .section-title .mascot { width: 52px; height: 52px; flex: none; }
  .section-title h2 { font-size: 21px; }
  .section-title small { display: block; font-size: 12px; color: var(--muted); font-style: italic; font-weight: 400; }

  .dots-row { display: flex; justify-content: center; gap: 9px; margin-top: 34px; }
  .dots-row i { width: 10px; height: 10px; border-radius: 50%; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>

/* ── kawaii mascots (inline SVG) ── */
const FACE = (cx, cy, s = 1, ec = "#5C4033") =>
  `<circle cx="${cx - 22*s}" cy="${cy}" r="${5*s}" fill="${ec}"/><circle cx="${cx + 22*s}" cy="${cy}" r="${5*s}" fill="${ec}"/>` +
  `<path d="M${cx - 10*s},${cy + 12*s} Q${cx},${cy + 20*s} ${cx + 10*s},${cy + 12*s}" stroke="${ec}" stroke-width="${4*s}" fill="none" stroke-linecap="round"/>` +
  `<circle cx="${cx - 36*s}" cy="${cy + 12*s}" r="${8*s}" fill="#FFB3C1" opacity=".7"/><circle cx="${cx + 36*s}" cy="${cy + 12*s}" r="${8*s}" fill="#FFB3C1" opacity=".7"/>`;
const SVG = (inner) => `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">${inner}</svg>`;
const rays = [0,45,90,135,180,225,270,315].map(a => { const r = a*Math.PI/180;
  return `<line x1="${100+Math.cos(r)*62}" y1="${100+Math.sin(r)*62}" x2="${100+Math.cos(r)*85}" y2="${100+Math.sin(r)*85}" stroke="#FFC94D" stroke-width="9" stroke-linecap="round"/>`; }).join("");
const petals = (fill) => [0,72,144,216,288].map(a => { const r = (a-90)*Math.PI/180;
  const x = 100+Math.cos(r)*42, y = 100+Math.sin(r)*42;
  return `<ellipse cx="${x}" cy="${y}" rx="26" ry="34" transform="rotate(${a} ${x} ${y})" fill="${fill}"/>`; }).join("");

const SPK_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1-3.29-2.5-4.03v8.05c1.5-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>';
let jaVoice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  jaVoice = vs.find(v => v.lang === "ja-JP") || vs.find(v => v.lang && v.lang.startsWith("ja")) || null;
}
if ("speechSynthesis" in window) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function cleanJP(t) {
  return t
    .replace(/[（(][^）)]*[）)]/g, "")   // drop kanji/notes in parentheses
    .replace(/[〜~]/g, "、")             // placeholder tilde -> pause
    .replace(/[＿_○〇]+/g, "、")         // blanks -> pause
    .replace(/\s*\/\s*/g, "、")          // alternatives -> pause
    .replace(/、+/g, "、").replace(/^、|、$/g, "").trim();
}
function speak(text, btn) {
  if (!("speechSynthesis" in window)) { alert("你的浏览器不支持语音朗读 (Web Speech API)"); return; }
  speechSynthesis.cancel();
  document.querySelectorAll(".spk.playing").forEach(b => b.classList.remove("playing"));
  const u = new SpeechSynthesisUtterance(cleanJP(text));
  u.lang = "ja-JP"; u.rate = 0.85; u.pitch = 1.05;
  if (!jaVoice) pickVoice();
  if (jaVoice) u.voice = jaVoice;
  if (btn) { btn.classList.add("playing"); u.onend = u.onerror = () => btn.classList.remove("playing"); }
  speechSynthesis.speak(u);
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-say]");
  if (b) { e.stopPropagation(); speak(b.dataset.say, b); }
});

backBtn.addEventListener("click", () => {

function go(s) { if ("speechSynthesis" in window) speechSynthesis.cancel(); state = { ...state, ...s }; render(); window.scrollTo({ top: 0 }); }

/* ── quiz engine ── */
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function buildQuiz(course, lesson) {
  const pool = lesson.items.filter(it => it.jp && it.cn);
  const coursePool = course.chapters.flatMap(cc => cc.lessons).flatMap(l => l.items).filter(it => it.jp && it.cn);
  const picks = shuffle(pool).slice(0, Math.min(5, pool.length));
  const types = ["jp2cn", "cn2jp", "jp2ro"];
  return picks.map((item, i) => {
    const type = types[i % 3];
    const key = type === "cn2jp" ? "jp" : type === "jp2ro" ? "ro" : "cn";
    const distractors = shuffle(coursePool.filter(o => o !== item && o[key] !== item[key]))
      .filter((o, idx, arr) => arr.findIndex(x => x[key] === o[key]) === idx)
      .slice(0, 3).map(o => o[key]);
    const options = shuffle([item[key], ...distractors]);
    let text, hint, tag, showSpk = false;
    if (type === "jp2cn") { tag = "日语 → 中文"; text = `「${item.jp}」是什么意思？`; hint = item.ro; showSpk = true; }
    else if (type === "cn2jp") { tag = "中文 → 日语"; text = `「${item.cn}」用日语怎么说？`; hint = ""; }
    else { tag = "罗马音 Romaji"; text = `「${item.jp}」的罗马音是？`; hint = item.cn; showSpk = true; }
    return { text, hint, tag, options, answer: item[key], jp: item.jp, showSpk };
  });
}

function startQuiz(lessonIdx) {
  const course = DATA.courses[state.course];
  const ch = course.chapters[state.chapter];
  const lesson = ch.lessons[lessonIdx];
  const questions = buildQuiz(course, lesson);
  let qi = 0, score = 0;
  const results = [];
  state.page = "quiz"; state.openLesson = lessonIdx; backBtn.style.display = "inline-block";

  function renderQ() {
    if (qi >= questions.length) return renderResult();
    const q = questions[qi];
    view.innerHTML = `
      <div class="quiz-wrap">
        <div class="section-title">
          <span class="mascot">${mascot(lesson.illo || ch.illo)}</span>
          <h2>Day ${lesson.day} 小测验：${esc(lesson.cn)}<small>第 ${qi + 1} / ${questions.length} 题</small></h2>
        </div>
        <div class="q-progress">${questions.map((_, i) =>
          `<span class="q-dot ${i < qi ? (results[i] ? "ok" : "bad") : i === qi ? "now" : ""}"></span>`).join("")}</div>
        <div class="q-card">
          <span class="q-type" style="background:${ch.color}">${q.tag}</span>
          <div class="q-text">${esc(q.text)}
            ${q.showSpk ? `<button class="spk spk-lg" data-say="${esc(q.jp)}" title="朗读 きく" aria-label="朗读">${SPK_ICON}</button>` : ""}</div>
          <div class="q-hint">${esc(q.hint)}</div>
          <div class="opts">${q.options.map(o => `<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>
          <div class="q-feedback" id="fb"></div>
        </div>
      </div>`;
    view.querySelectorAll(".opt").forEach(btn => btn.addEventListener("click", () => {
      const ok = btn.dataset.v === q.answer;
      results.push(ok); if (ok) score++;
      view.querySelectorAll(".opt").forEach(b => {
        b.disabled = true;
        if (b.dataset.v === q.answer) b.classList.add("correct");
        else if (b === btn) b.classList.add("wrong");
        else b.classList.add("dim");
      });
      speak(q.jp);  // read the Japanese aloud as reinforcement
      const fb = document.getElementById("fb");
      fb.innerHTML = (ok ? "せいかい！答对啦 ⭕" : `ざんねん…正确答案：${esc(q.answer)}`) +
        ` <button class="spk" data-say="${esc(q.jp)}" title="再听一次" aria-label="再听一次">${SPK_ICON}</button>`;
      fb.className = "q-feedback " + (ok ? "ok" : "no");
      setTimeout(() => { qi++; renderQ(); }, ok ? 1300 : 2100);
    }));
  }

  function renderResult() {
    const total = questions.length;
    const pct = score / total;
    const stars = pct === 1 ? "⭐⭐⭐" : pct >= .6 ? "⭐⭐" : "⭐";
    const msg = pct === 1 ? "パーフェクト！全对，太厉害了！"
      : pct >= .6 ? "よくできました！很不错，再复习一下错题吧～"
      : "がんばって！回去看看课程内容，再挑战一次！";
    if (pct >= .6) doneQuizzes.add(course.id + ":" + state.chapter + ":" + lessonIdx);
    const hasNextLesson = lessonIdx < ch.lessons.length - 1;
    const hasNextChapter = state.chapter < course.chapters.length - 1;
    view.innerHTML = `
      <div class="result">
        <span class="mascot" style="display:inline-block;width:100px;height:100px">${pct >= .6 ? M.trophy : M.heart}</span>
        <div class="stars-row">${stars}</div>
        <h2>Day ${lesson.day} 完成！</h2>
        <div class="score">${score} / ${total}</div>
        <p>${esc(msg)}</p>
        <div class="row">
          <button class="btn" id="retry">再来一次 もういちど</button>
          <button class="btn ghost" id="backCh">回到章节</button>
          ${hasNextLesson ? `<button class="btn ghost" id="nextL">下一天 →</button>`
            : hasNextChapter ? `<button class="btn ghost" id="nextCh">下一章 →</button>` : ""}
        </div>
      </div>`;
    document.getElementById("retry").addEventListener("click", () => startQuiz(lessonIdx));
    document.getElementById("backCh").addEventListener("click", () => go({ page: "chapter", openLesson: lessonIdx }));
    const nl = document.getElementById("nextL");
    if (nl) nl.addEventListener("click", () => go({ page: "chapter", openLesson: lessonIdx + 1 }));
    const nc = document.getElementById("nextCh");
    if (nc) nc.addEventListener("click", () => go({ page: "chapter", chapter: state.chapter + 1, openLesson: 0 }));
  }

  renderQ();
}

render();
</script>
</body>
</html>
